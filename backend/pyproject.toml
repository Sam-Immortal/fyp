[project]
name = "scamguard-backend"
version = "0.1.0"
description = "Deepfake Audio Detection & AI Scam Alert System - Backend"
authors = [{ name = "ScamGuard Team" }]
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyjwt[crypto]>=2.8.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "passlib[bcrypt]>=1.7.4",
    "redis>=5.0.1",
    "taskiq>=0.10.0",
    "taskiq-redis>=0.10.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.24.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "email-validator>=2.1.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "librosa>=0.10.1",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "aiosqlite>=0.20.0",
    "pandas>=2.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["__pycache__", ".venv", "build", "dist", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true