name: scamguard

services:
  postgres:
    image: postgres:16-alpine
    container_name: scamguard-postgres
    environment:
      POSTGRES_USER: scamguard
      POSTGRES_PASSWORD: scamguard
      POSTGRES_DB: scamguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scamguard -d scamguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: scamguard-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: scamguard-backend:dev
    container_name: scamguard-api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://scamguard:scamguard@postgres:5432/scamguard
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-development-secret-please-change
      HF_TOKEN: ${HF_TOKEN:-}
      HF_LLM_MODEL: ${HF_LLM_MODEL:-mistralai/Mistral-7B-Instruct-v0.3}
      HF_INFERENCE_BASE_URL: ${HF_INFERENCE_BASE_URL:-https://router.huggingface.co/v1}
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: scamguard-backend:dev
    pull_policy: never
    container_name: scamguard-worker
    command: ["taskiq", "worker", "app.workers.broker:broker", "app.nlp.tasks"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://scamguard:scamguard@postgres:5432/scamguard
      REDIS_URL: redis://redis:6379/0
      HF_TOKEN: ${HF_TOKEN:-}
      HF_LLM_MODEL: ${HF_LLM_MODEL:-mistralai/Mistral-7B-Instruct-v0.3}
      HF_INFERENCE_BASE_URL: ${HF_INFERENCE_BASE_URL:-https://router.huggingface.co/v1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      disable: true

  scheduler:
    image: scamguard-backend:dev
    pull_policy: never
    container_name: scamguard-scheduler
    command: ["taskiq", "scheduler", "app.workers.broker:scheduler", "app.nlp.tasks"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://scamguard:scamguard@postgres:5432/scamguard
      REDIS_URL: redis://redis:6379/0
      HF_TOKEN: ${HF_TOKEN:-}
      HF_LLM_MODEL: ${HF_LLM_MODEL:-mistralai/Mistral-7B-Instruct-v0.3}
      HF_INFERENCE_BASE_URL: ${HF_INFERENCE_BASE_URL:-https://router.huggingface.co/v1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  postgres_data: